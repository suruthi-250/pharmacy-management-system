{% extends "base.html" %}
{% block title %}Login — PharmaCare{% endblock %}
{% block page_title %}Login{% endblock %}

{% block content %}
<div style="max-width:420px; margin:80px auto;">
  <div style="text-align:center; margin-bottom:32px;">
    <div style="font-family:var(--font-heading); font-size:28px; font-weight:800; color:var(--navy);">
      Pharma<span style="color:var(--teal);">Care</span>
    </div>
    <p style="color:var(--muted); margin-top:8px; font-size:14px;">Sign in to your account</p>
  </div>

  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required autofocus>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;">
        Sign In →
      </button>
    </form>
  </div>

  <p style="text-align:center; font-size:12px; color:var(--muted); margin-top:16px;">
    Default: admin / admin123
  </p>
</div>
{% endblock %}
